<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zenith '26 | Android App Live Emulator Preview</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              500: '#8b5cf6',
              600: '#7c3aed',
              700: '#6d28d9',
            }
          }
        }
      }
    }
  </script>
  <style>
    /* Phone bezel styling */
    .phone-mockup {
      width: 412px;
      height: 870px;
      border-radius: 44px;
      box-shadow: 0 0 0 12px #1e293b, 0 0 0 14px #334155, 0 25px 60px -15px rgba(0,0,0,0.7);
    }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: #020617; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
  </style>
</head>
<body class="min-h-full flex flex-col items-center justify-center p-4 bg-gradient-to-br from-slate-950 via-slate-900 to-slate-950">

  <!-- TOP BAR -->
  <div class="w-full max-w-4xl flex items-center justify-between mb-4 px-2">
    <div class="flex items-center gap-3">
      <span class="text-2xl">📱</span>
      <div>
        <h1 class="text-lg font-bold text-white flex items-center gap-2">
          <span>Zenith '26 Android App</span>
          <span class="text-xs font-semibold px-2 py-0.5 rounded-full bg-purple-900/60 text-purple-300 border border-purple-700/50">Kotlin & Jetpack Compose</span>
        </h1>
        <p class="text-xs text-slate-400">Side-by-side interactive preview connected to live FastAPI backend at <code class="text-purple-300">/api/events</code></p>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <a href="/" target="_blank" class="px-3 py-1.5 text-xs font-medium rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 transition-colors flex items-center gap-1.5">
        <span>🌐</span> <span>Web Version</span>
      </a>
      <a href="/admin.html" target="_blank" class="px-3 py-1.5 text-xs font-medium rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 transition-colors flex items-center gap-1.5">
        <span>📊</span> <span>Web Admin</span>
      </a>
      <a href="/docs" target="_blank" class="px-3 py-1.5 text-xs font-medium rounded-lg bg-purple-600 hover:bg-purple-500 text-white transition-colors flex items-center gap-1.5">
        <span>📜</span> <span>API Docs</span>
      </a>
    </div>
  </div>

  <!-- PHONE CONTAINER -->
  <div class="relative phone-mockup bg-slate-950 overflow-hidden border border-slate-800 flex flex-col">
    <!-- ANDROID STATUS BAR -->
    <div class="h-8 bg-slate-950 flex items-center justify-between px-6 text-[11px] text-slate-400 font-medium select-none z-30">
      <span>10:30</span>
      <div class="w-16 h-3.5 bg-slate-900 rounded-full mx-auto"></div>
      <div class="flex items-center gap-1.5">
        <span>📶</span>
        <span>5G</span>
        <span>🔋 98%</span>
      </div>
    </div>

    <!-- APP IFRAME -->
    <iframe src="/" class="w-full flex-grow border-0" title="Android Preview"></iframe>

    <!-- ANDROID GESTURE NAVIGATION BAR -->
    <div class="h-6 bg-slate-950 flex items-center justify-center select-none z-30">
      <div class="w-32 h-1 bg-slate-600 rounded-full"></div>
    </div>
  </div>

  <p class="mt-4 text-xs text-slate-500 text-center">
    Native Android source code located in <code class="text-slate-400">zenith26-fest-system/android/</code> · Kotlin + Jetpack Compose
  </p>
</body>
</html>
